name: '${APPLICATION_NAME}'
services:
    myadmin:
        container_name: ${PMA_CONTAINER_NAME}
        image: ${PMA_IMAGE}
        environment:
            UPLOAD_LIMIT: 262144000
            PMA_HOSTS: ${PMA_HOSTS}
            PMA_VERBOSES: ${PMA_VERBOSES}
        # Accès uniquement par tunnel SSH : ssh -N -L 8081:127.0.0.1:8081 laurent@<vps>
        ports:
            - "127.0.0.1:8081:80"
        networks:
            - pma_network
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped
networks:
    pma_network:
        name: pma_network
        external: true
